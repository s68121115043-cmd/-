<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hardware Detective Arena</title><style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap');:root{color-scheme:dark;--bg:#090f20;--card:#121d35;--stroke:#314362;--cyan:#4de2e7;--gold:#ffcf69;--white:#f3f7ff}*{box-sizing:border-box}body{margin:0;font-family:Kanit,system-ui,sans-serif;background:radial-gradient(circle at 12% 8%,#17345c 0,transparent 32%),radial-gradient(circle at 90% 70%,#172748 0,transparent 40%),var(--bg);color:var(--white);min-height:100vh}header{padding:22px 5vw;border-bottom:1px solid #24344e;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:700;letter-spacing:1.5px;color:var(--cyan);font-size:clamp(17px,2.5vw,25px)}.tag{font-size:12px;border:1px solid #46617f;border-radius:30px;padding:6px 13px;color:#c4d7ec}main{max-width:1060px;margin:40px auto;padding:0 20px 50px}.hero{text-align:center;margin:30px auto 36px}.eyebrow{letter-spacing:3px;color:var(--gold);font-size:12px;font-weight:600}.hero h1{font-size:clamp(34px,6vw,65px);line-height:1.15;margin:10px 0}.hero p{color:#adbed7;font-size:16px}.panel{background:linear-gradient(145deg,#182640,#10192d);border:1px solid var(--stroke);border-radius:22px;padding:clamp(20px,4vw,36px);box-shadow:0 20px 60px #0003}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.choice{cursor:pointer;text-align:left;background:#1b2b47;border:1px solid #39516e;color:white;border-radius:16px;padding:22px;min-height:95px;font:inherit;font-size:20px;transition:.15s}.choice:hover{border-color:var(--cyan);transform:translateY(-2px)}.choice:disabled{opacity:.6;cursor:default;transform:none}.choice .letter{color:var(--cyan);margin-right:12px;font-weight:700}.button{font:inherit;border:0;border-radius:13px;padding:14px 22px;background:var(--cyan);color:#061528;font-weight:700;cursor:pointer}.button.alt{background:#243a59;color:white;border:1px solid #4a6788}.button.gold{background:var(--gold)}.button:disabled{opacity:.4;cursor:not-allowed}input{width:100%;border-radius:12px;border:1px solid #4a6282;background:#091429;color:white;font:inherit;font-size:20px;padding:14px 16px;outline:none}input:focus{border-color:var(--cyan)}label{display:block;color:#bcd0e7;margin-bottom:7px}h2{margin:0 0 14px;font-size:clamp(24px,4vw,34px)}h3{margin:8px 0}.muted{color:#a7bad2}.pin{font-size:clamp(50px,9vw,86px);letter-spacing:12px;font-weight:700;color:var(--gold);text-align:center;margin:8px 0}.players{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.pill{border:1px solid #43617e;background:#1a2b45;padding:9px 16px;border-radius:40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}.progress{height:9px;border-radius:10px;background:#263650;overflow:hidden;margin:18px 0}.bar{height:100%;background:var(--cyan);transition:width .3s}.timer{font-size:26px;color:var(--gold);font-weight:700}.board{width:100%;border-collapse:collapse}.board td{padding:13px;border-bottom:1px solid #32435b}.board td:last-child{text-align:right;color:var(--gold);font-weight:700}.status{margin-top:16px;color:var(--gold);min-height:25px}.center{text-align:center}.trophy{font-size:52px}.foot{font-size:12px;color:#8095b1;text-align:center;margin-top:28px}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.choice{min-height:70px;padding:14px;font-size:17px}.pin{letter-spacing:5px}header{padding:15px}main{margin:20px auto}}
</style></head><body><header><div class="brand">◈ HARDWARE DETECTIVE <span style="color:white">ARENA</span></div><span class="tag">M.1 · LIVE CLASSROOM</span></header><main><div id="app"></div><div class="foot">ระบบห้องเรียนออนไลน์ · ครูควบคุมคำถาม · นักเรียนตอบจากอุปกรณ์ของตนเอง</div></main><script>
const app=document.querySelector('#app');let socket,role='',pin='',playerId=null,phase='',lastQuestion=null,answered=false,players=[],index=0,total=12,deadline=0,ticker=null,error='';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function send(type,more={}){if(socket?.readyState===1)socket.send(JSON.stringify({type,...more}))}function connect(cb){if(socket&&socket.readyState===1)return cb();socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);socket.onopen=cb;socket.onmessage=e=>handle(JSON.parse(e.data));socket.onclose=()=>{clearInterval(ticker);if(role)app.innerHTML=`<div class="panel center"><h2>การเชื่อมต่อสิ้นสุด</h2><p class="muted">เซิร์ฟเวอร์อาจกำลังเริ่มใหม่หรืออินเทอร์เน็ตหลุด</p><button class="button" onclick="location.reload()">กลับหน้าหลัก</button></div>`};socket.onerror=()=>{error='ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้'};}function home(){app.innerHTML=`<div class="hero"><div class="eyebrow">THE FUTURE OF CLASSROOM PLAY</div><h1>ไขปริศนา<br><span style="color:var(--cyan)">อุปกรณ์คอมพิวเตอร์</span></h1><p>รู้จัก Hardware · แข่งขันตอบคำถาม · ขึ้นแท่นผู้ชนะ</p></div><div class="grid"><div class="panel"><div class="eyebrow">TEACHER MODE</div><h2>สร้างห้องแข่งขัน</h2><p class="muted">รับรหัส PIN 6 หลัก ควบคุมคำถามและดูคะแนนสด</p><button class="button" onclick="create()">สร้างห้องใหม่ →</button></div><div class="panel"><div class="eyebrow">STUDENT MODE</div><h2>เข้าร่วมการแข่งขัน</h2><label>รหัส PIN</label><input id="joinpin" inputmode="numeric" maxlength="6" placeholder="กรอก PIN 6 หลัก"><label style="margin-top:12px">ชื่อเล่น</label><input id="joinname" maxlength="20" placeholder="เช่น นักสืบไอที"><button class="button gold" style="margin-top:17px;width:100%" onclick="join()">เข้าห้อง →</button></div></div><div class="status center" id="err"></div>`}function create(){role='host';connect(()=>send('create'))}function join(){const p=document.querySelector('#joinpin').value.trim(),n=document.querySelector('#joinname').value.trim();if(!/^\d{6}$/.test(p)||!n)return document.querySelector('#err').textContent='กรุณากรอก PIN 6 หลักและชื่อเล่น';role='player';connect(()=>send('join',{pin:p,name:n}))}function handle(m){if(m.type==='error'){const el=document.querySelector('#err')||document.querySelector('#status');if(el)el.textContent=m.message;else alert(m.message);return}if(m.type==='created'||m.type==='joined'){pin=m.pin;playerId=m.id||null;phase='lobby';lobby()}if(m.type==='state'){phase=m.phase;players=m.players;index=m.index;total=m.total;if(phase==='lobby')lobby();else if(phase==='question'){const x=document.querySelector('#answeredcount');if(x)x.textContent=`ตอบแล้ว ${m.answered}/${players.length} คน`}else if(phase==='reveal'){const x=document.querySelector('#status');if(x)x.textContent=`ตอบแล้ว ${m.answered}/${players.length} คน`}return}if(m.type==='question'){phase='question';answered=false;lastQuestion=m;deadline=m.endsAt;question();return}if(m.type==='answered'){answered=true;const x=document.querySelector('#answerState');if(x)x.textContent=`ส่งคำตอบแล้ว · ${m.correct?'ถูกต้อง +'+m.earned+' คะแนน':'ยังไม่ถูกต้อง'} · รอเฉลย`;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);return}if(m.type==='reveal'){phase='reveal';players=m.players;reveal(m);return}if(m.type==='finished'){phase='finished';players=m.players;finished();return}if(m.type==='closed'){app.innerHTML='<div class="panel center"><h2>ครูปิดห้องแล้ว</h2><button class="button" onclick="location.reload()">กลับหน้าหลัก</button></div>'}}function lobby(){app.innerHTML=`<div class="panel"><div class="top"><span class="eyebrow">${role==='host'?'ห้องของครู':'ห้องรอการแข่งขัน'}</span><span class="tag">${players.length} ผู้เล่น</span></div><div class="center"><p class="muted">รหัสเข้าห้อง</p><div class="pin">${pin}</div><p class="muted">${role==='host'?'ให้นักเรียนเปิดลิงก์เว็บไซต์เดียวกัน แล้วกรอก PIN':'รอครูเริ่มเกม นักสืบเตรียมตัวให้พร้อม!'}</p></div><h3>ผู้เข้าร่วม</h3><div class="players">${players.map(p=>`<span class="pill">◈ ${esc(p.name)}</span>`).join('')||'<span class="muted">ยังไม่มีผู้เข้าร่วม</span>'}</div>${role==='host'?'<button class="button" onclick="send(\'start\')">เริ่มเกม →</button>':''}<div class="status" id="status"></div></div>`}function question(){const m=lastQuestion;app.innerHTML=`<div class="panel"><div class="top"><span class="eyebrow">QUESTION ${m.index+1} / ${m.total}</span><span class="timer" id="time">20s</span></div><div class="progress"><div class="bar" id="bar" style="width:100%"></div></div><h2>${esc(m.q)}</h2><div class="grid" style="margin-top:24px">${m.a.map((a,i)=>`<button class="choice" ${role==='host'?'disabled':''} onclick="pick(${i})"><span class="letter">${'ABCD'[i]}</span>${esc(a)}</button>`).join('')}</div><p class="status" id="answerState">${role==='host'?'ครูกำลังฉายคำถาม · รอผู้เล่นตอบ':'เลือกคำตอบที่ถูกต้องก่อนหมดเวลา'}</p><div class="top"><span class="muted" id="answeredcount">กำลังตอบ...</span>${role==='host'?'<button class="button alt" onclick="send(\'skip\')">เฉลยทันที</button>':''}</div></div>`;clearInterval(ticker);function tick(){const rem=Math.max(0,deadline-Date.now()),el=document.querySelector('#time');if(el)el.textContent=Math.ceil(rem/1000)+'s';const bar=document.querySelector('#bar');if(bar)bar.style.width=rem/200+'%'}tick();ticker=setInterval(tick,150)}function pick(i){if(answered||role!=='player')return;answered=true;send('answer',{choice:i});document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.querySelector('#answerState').textContent='ส่งคำตอบแล้ว รอเฉลย...'}function scoreboard(){return `<table class="board">${[...players].sort((a,b)=>b.score-a.score).map((p,i)=>`<tr><td>${i+1}. ${esc(p.name)}</td><td>${p.score.toLocaleString()} คะแนน</td></tr>`).join('')}</table>`}function reveal(m){clearInterval(ticker);app.innerHTML=`<div class="panel"><div class="eyebrow">ANSWER REVEALED</div><h2>คำตอบที่ถูกต้อง: <span style="color:var(--cyan)">${'ABCD'[m.correct]} · ${esc(lastQuestion.a[m.correct])}</span></h2><p class="muted">${esc(m.why)}</p><h3 style="margin-top:26px">ตารางคะแนนล่าสุด</h3>${scoreboard()}<div class="status" id="status"></div>${role==='host'?'<button class="button" onclick="send(\'next\')">คำถามถัดไป →</button>':'<p class="muted">รอครูเปิดคำถามถัดไป</p>'}</div>`}function finished(){clearInterval(ticker);const sorted=[...players].sort((a,b)=>b.score-a.score);app.innerHTML=`<div class="panel center"><div class="eyebrow">MISSION COMPLETE</div><div class="trophy">🏆</div><h1>HARDWARE CHAMPIONS</h1><p class="muted">สุดยอดนักสืบอุปกรณ์คอมพิวเตอร์</p><div class="grid" style="grid-template-columns:repeat(${Math.min(sorted.length,3)},1fr);margin:30px 0">${sorted.slice(0,3).map((p,i)=>`<div style="padding:22px 10px;border:1px solid #4d6480;border-radius:18px;background:#1b2b47"><div style="font-size:35px">${['🥇','🥈','🥉'][i]}</div><h3>${esc(p.name)}</h3><div style="color:var(--gold)">${p.score.toLocaleString()} คะแนน</div></div>`).join('')}</div><h3 style="text-align:left">อันดับทั้งหมด</h3>${scoreboard()}${role==='host'?'<button class="button" style="margin-top:20px" onclick="send(\'restart\')">เริ่มรอบใหม่</button>':''}</div>`}home();
</script></body></html>
